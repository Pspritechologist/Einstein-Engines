- type: entity
  name: owo
  parent: BaseComputer
  id: TestIterasmMachine
  components:
  # - type: TestIterasm
  - type: IterasmMachine
    tickSound:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
      params:
        volume: 0.5
    errorSound:
      path: /Audio/Items/Defib/defib_failed.ogg
  - type: IterasmLogLib
  - type: IterasmMachineDefaultProgrammed
    program: |
      ent 5
      setstr 1 'Hello, World!'

      # loop

      log 1

      addi 0 0 25t
      # timer1
      subi 0 0 1t
      jmpif timer1 0

      logi 'Goodbye, World!'

      addi 0 0 25t
      # timer2
      subi 0 0 1t
      jmpif timer2 0

      jmp loop

  - type: Paper
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface

  - type: DeviceLinkSink
    ports:
      - Close
      - DoorBolt
      - Trigger
  - type: DeviceLinkSource
    ports:
      - Start
      - Output
      - AirDanger
  - type: SoundOnOverload
  - type: SpawnOnOverload

- type: entity
  parent: BaseItem
  id: IterasmDbgCartridge
  name: iterasm dbg cartridge
  description: A program for keeping notes.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-nav
  - type: UIFragment
    ui: !type:IterasmDbgUi
  - type: Cartridge
    programName: Debugger
    icon:
      sprite:  Objects/Misc/books.rsi
      state: book_icon
  - type: IterasmDbgCartridge
